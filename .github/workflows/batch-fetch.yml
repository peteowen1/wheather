name: Batch Weather Fetch

on:
  schedule:
    - cron: '0 17 * * *'  # 17:00 UTC daily = 3am AEST / 4am AEDT
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  batch-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            httr2
            data.table
            arrow
            cli
            maps
            jsonlite
            devtools

      # The parquet cache is data, so it lives on the 'cache' release, not in
      # git history.
      #
      # The expected file count comes from the COMMITTED progress file, not from
      # the release API. That matters: a failed `gh` query and a genuinely absent
      # asset are indistinguishable from the API alone, so trusting it would let
      # a transient outage restore nothing, then publish that nothing over a good
      # archive. Cold start is only legitimate when the committed count is 0.
      - name: Restore weather cache from release
        run: |
          set -euo pipefail
          mkdir -p data/cache
          EXPECTED=$(jq -r '.cache_files // 0' data/batch_progress.json)

          # Fallback to a cache-new-<run>.tar.gz: the publish step uploads under
          # that name and only renames it once the old asset is deleted, so a run
          # interrupted between the two leaves the data there, not nowhere.
          NEWEST_TMP=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/cache" \
            --jq '[.assets[] | select(.name | test("^cache-new-[0-9]+[.]tar[.]gz$"))] | sort_by(.created_at) | last | .name // empty' 2>/dev/null || true)
          if gh release download cache --pattern cache.tar.gz --dir . 2> restore-err.log; then
            tar -xzf cache.tar.gz -C data
            rm cache.tar.gz
          elif [ -n "$NEWEST_TMP" ] && gh release download cache --pattern "$NEWEST_TMP" --dir . 2>> restore-err.log; then
            echo "::warning::cache.tar.gz missing; restored from $NEWEST_TMP (a publish was interrupted before its rename)"
            tar -xzf "$NEWEST_TMP" -C data
            rm "$NEWEST_TMP"
          elif [ "$EXPECTED" -eq 0 ]; then
            echo "No cache asset and none expected - starting cold."
            cat restore-err.log
          else
            echo "::error::Cache restore failed while $EXPECTED files were expected: $(cat restore-err.log)"
            exit 1
          fi
          rm -f restore-err.log

          ACTUAL=$(ls data/cache | wc -l)
          if [ "$ACTUAL" -lt "$EXPECTED" ]; then
            echo "::error::Restored $ACTUAL cache files but $EXPECTED were expected. Refusing to continue - publishing from here would shrink the release asset."
            exit 1
          fi
          echo "CACHE_FILES_BEFORE=$ACTUAL" >> "$GITHUB_ENV"
          echo "Restored $ACTUAL cached city files (expected at least $EXPECTED)"

      # One implementation, in batch_run.R. This step used to carry a second
      # copy inline; the two drifted and only one had the 429 circuit breaker.
      - name: Run batch fetch
        run: Rscript batch_run.R

      - name: Publish weather cache to release
        run: |
          set -euo pipefail
          AFTER=$(ls data/cache | wc -l)
          if [ "$AFTER" -lt "$CACHE_FILES_BEFORE" ]; then
            echo "::error::Cache shrank ($CACHE_FILES_BEFORE -> $AFTER); refusing to clobber the release asset."
            exit 1
          fi
          # Never `--clobber` the archive: clobber DELETES the old asset first, and
          # on 2026-09-17 the upload that followed failed (HTTP 500 "Error saving
          # asset"), leaving the release empty for three weeks. Upload under a
          # unique name, confirm it landed at full size, and only then delete the
          # old asset and rename the new one into place.
          NEW="cache-new-${GITHUB_RUN_ID}.tar.gz"
          tar -czf "$NEW" -C data cache
          gh release upload cache "$NEW"
          LOCAL_SIZE=$(stat -c %s "$NEW")
          ASSETS=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/cache" --jq '.assets')
          NEW_ID=$(jq -r --arg n "$NEW" '.[] | select(.name == $n and .state == "uploaded") | .id' <<<"$ASSETS")
          NEW_SIZE=$(jq -r --arg n "$NEW" '.[] | select(.name == $n) | .size' <<<"$ASSETS")
          if [ -z "$NEW_ID" ] || [ "$NEW_SIZE" != "$LOCAL_SIZE" ]; then
            echo "::error::Uploaded $NEW is missing or the wrong size (${NEW_SIZE:-none} vs $LOCAL_SIZE bytes); the old archive is left untouched."
            exit 1
          fi
          # Delete the old archive and any leftover temporary copies, then rename.
          for OLD_ID in $(jq -r --arg n "$NEW" '.[] | select(.name == "cache.tar.gz" or (.name | test("^cache-new-[0-9]+[.]tar[.]gz$") and . != $n)) | .id' <<<"$ASSETS"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$OLD_ID"
          done
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$NEW_ID" -f name=cache.tar.gz >/dev/null
          rm "$NEW"
          echo "Published $AFTER cached city files to the 'cache' release ($LOCAL_SIZE bytes)"

      - name: Commit progress
        run: |
          set -euo pipefail
          # No commit message means the fetch script exited before doing any
          # work - the terminal "all years complete" path does exactly that.
          # Without this guard the bare `cat` below fails under `set -e` and the
          # workflow goes permanently red once the backfill finishes.
          if [ ! -f data/.commit_msg ]; then
            echo "No commit message written - nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/batch_progress.json
          COMMIT_MSG=$(cat data/.commit_msg)
          git diff --cached --quiet || git commit -m "$COMMIT_MSG"
          git push origin dev
