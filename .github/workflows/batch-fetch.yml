name: Batch Weather Fetch

on:
  schedule:
    - cron: '0 17 * * *'  # 17:00 UTC daily = 3am AEST / 4am AEDT
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  batch-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            httr2
            data.table
            arrow
            cli
            maps
            jsonlite
            devtools

      # The parquet cache is data, so it lives on the 'cache' release, not in
      # git history.
      #
      # The expected file count comes from the COMMITTED progress file, not from
      # the release API. That matters: a failed `gh` query and a genuinely absent
      # asset are indistinguishable from the API alone, so trusting it would let
      # a transient outage restore nothing, then publish that nothing over a good
      # archive. Cold start is only legitimate when the committed count is 0.
      - name: Restore weather cache from release
        run: |
          set -euo pipefail
          mkdir -p data/cache
          EXPECTED=$(jq -r '.cache_files // 0' data/batch_progress.json)

          if gh release download cache --pattern cache.tar.gz --dir . 2> restore-err.log; then
            tar -xzf cache.tar.gz -C data
            rm cache.tar.gz
          elif [ "$EXPECTED" -eq 0 ]; then
            echo "No cache asset and none expected - starting cold."
            cat restore-err.log
          else
            echo "::error::Cache restore failed while $EXPECTED files were expected: $(cat restore-err.log)"
            exit 1
          fi
          rm -f restore-err.log

          ACTUAL=$(ls data/cache | wc -l)
          if [ "$ACTUAL" -lt "$EXPECTED" ]; then
            echo "::error::Restored $ACTUAL cache files but $EXPECTED were expected. Refusing to continue - publishing from here would shrink the release asset."
            exit 1
          fi
          echo "CACHE_FILES_BEFORE=$ACTUAL" >> "$GITHUB_ENV"
          echo "Restored $ACTUAL cached city files (expected at least $EXPECTED)"

      # One implementation, in batch_run.R. This step used to carry a second
      # copy inline; the two drifted and only one had the 429 circuit breaker.
      - name: Run batch fetch
        run: Rscript batch_run.R

      - name: Publish weather cache to release
        run: |
          set -euo pipefail
          AFTER=$(ls data/cache | wc -l)
          if [ "$AFTER" -lt "$CACHE_FILES_BEFORE" ]; then
            echo "::error::Cache shrank ($CACHE_FILES_BEFORE -> $AFTER); refusing to clobber the release asset."
            exit 1
          fi
          tar -czf cache.tar.gz -C data cache
          gh release upload cache cache.tar.gz --clobber
          rm cache.tar.gz
          echo "Published $AFTER cached city files to the 'cache' release"

      - name: Commit progress
        run: |
          set -euo pipefail
          # No commit message means the fetch script exited before doing any
          # work - the terminal "all years complete" path does exactly that.
          # Without this guard the bare `cat` below fails under `set -e` and the
          # workflow goes permanently red once the backfill finishes.
          if [ ! -f data/.commit_msg ]; then
            echo "No commit message written - nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/batch_progress.json
          COMMIT_MSG=$(cat data/.commit_msg)
          git diff --cached --quiet || git commit -m "$COMMIT_MSG"
          git push origin dev
